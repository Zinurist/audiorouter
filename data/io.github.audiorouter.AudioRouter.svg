<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#242833"/>
    </linearGradient>
    <linearGradient id="wire1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#99c1f1"/>
    </linearGradient>
    <linearGradient id="wire2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#8ff0a4"/>
    </linearGradient>
  </defs>
  <!-- tile with GNOME-style bottom depth -->
  <rect x="8" y="16" width="112" height="104" rx="22" fill="#171a21"/>
  <rect x="8" y="10" width="112" height="104" rx="22" fill="url(#base)"/>
  <!-- routing wires -->
  <path d="M48 62 C 68 62, 66 36, 86 36" fill="none" stroke="url(#wire1)" stroke-width="7" stroke-linecap="round"/>
  <path d="M48 62 C 68 62, 66 88, 86 88" fill="none" stroke="url(#wire2)" stroke-width="7" stroke-linecap="round"/>
  <!-- source node with waveform -->
  <circle cx="34" cy="62" r="19" fill="#f6f5f4"/>
  <g stroke="#1c71d8" stroke-width="4" stroke-linecap="round">
    <line x1="24" y1="58" x2="24" y2="66"/>
    <line x1="29" y1="52" x2="29" y2="72"/>
    <line x1="34" y1="56" x2="34" y2="68"/>
    <line x1="39" y1="50" x2="39" y2="74"/>
    <line x1="44" y1="58" x2="44" y2="66"/>
  </g>
  <!-- output nodes -->
  <circle cx="94" cy="36" r="11" fill="#99c1f1"/>
  <circle cx="94" cy="36" r="4.5" fill="#242833"/>
  <circle cx="94" cy="88" r="11" fill="#8ff0a4"/>
  <circle cx="94" cy="88" r="4.5" fill="#242833"/>
</svg>
