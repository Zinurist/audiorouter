name: Release

# Pushing a tag `vX.Y` builds the app and attaches it to a draft release (published by hand).
# The tag must match the Cargo.toml version X.Y.0 (scripts/set-version.sh).
# Running the workflow manually builds the same files without publishing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - id: label
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ $REF != refs/tags/* ]]; then
            echo "label=dev-${SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if ! [[ $TAG =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags are vX.Y (e.g. v1.4), got $TAG"
            exit 1
          fi
          if [ "$crate" != "${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.0" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version $crate (run scripts/set-version.sh)"
            exit 1
          fi
          echo "label=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ needs.version.outputs.label }}

  publish:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/RELEASE_DISCLAIMER.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # The disclaimer, then GitHub's generated notes since the previous vX.Y release.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cp .github/RELEASE_DISCLAIMER.md notes.md
          echo >> notes.md
          previous=$(gh api "repos/$REPO/tags" --paginate -q '.[].name' |
            grep -E '^v[0-9]+\.[0-9]+$' | sort -V | awk -v tag="$TAG" '$0 == tag { print prev; exit } { prev = $0 }')
          if [ -n "$previous" ]; then
            gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" \
              -f previous_tag_name="$previous" -q .body >> notes.md
          else
            echo "First release of Audio Router." >> notes.md
          fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: dist/*
